<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blueth's Project Site</title>
  <link rel="stylesheet" href="style.css">
</head>
  <body>
    <div id="app">
      <div id="landing-screen" class="screen active">'
        <h1 class="main-title">Bluethunder's Project Site</h1>
        <button id="start-music-game" class="btn btn-primary">Song Quiz</button>
        <button id="start-ts-viewer" class="btn btn-primary">Theme Song Player</button>
        <button id="start-ts-game" class="btn btn-primary">Theme Song Quiz</button>
        <div class="auth-buttons" style="position: absolute; top: 20px; right: 20px;">
          <button id="login-btn" class="btn btn-secondary">Login</button>
          <button id="register-btn" class="btn btn-secondary">Sign Up</button>
          <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
          <span id="username-display" style="color: white; margin-left: 10px;"></span>
        </div>
      </div>
    </div>
    <script defer src="controller.js"></script>
  </body>
</html>
