<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Theme Song File Transfer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="app">
            <div id="landing-screen" class="screen active">
                <h1 class="title">Log In To Access</h1>
                <div class="auth-buttons" style="position: absolute; top: 20px; right: 20px;">
                    <button id="login-btn" class="btn btn-secondary">Login</button>
                    <button id="register-btn" class="btn btn-secondary">Sign Up</button>
                    <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
                    <span id="username-display" style="color: white; margin-left: 10px;"></span>
                </div>
            </div>
            <div id="upload-screen" class="screen">
                <h1 class="title">File Transfer</h1>
                <span>Upload Database <input type="file" id="upload-database"></span>
                <button id="update-database-and-videos" class="btn btn-primary">Update Database and Files</button>
            </div>
        </div>
        <script defer src="file-transfer.js"></script>
    </body>
</html>
