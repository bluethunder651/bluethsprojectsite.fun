<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Song Viewer</title>
  <link rel="stylesheet" href="tsViewerStyle.css">
</head>
  <body>
    <div id="app">
      <div id="landing-screen" class="screen active">
        <div class="auth-buttons" style="position: absolute; top: 20px; right: 20px;">
          <button id="login-btn" class="btn btn-secondary">Login</button>
          <button id="register-btn" class="btn btn-secondary">Sign Up</button>
          <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
          <span id="username-display" style="color: white; margin-left: 10px;"></span>
        </div>
        <h1 class="main-title">Theme Song Player</h1>
        <div class="status-row">
        <span class="status-label">Status:</span>
        <span id="server-status-indicator" class="status-badge status-offline">●</span>
        <span id="server-status-text">Checking...</span>
        </div>
        <div class="status-row" id="latency-row" style="display: none;">
            <span class="status-label">Latency:</span>
            <span id="latency-value">-</span>
        </div>
        <div class="nav-bar">
        <button id="refresh-status" class="nav-btn">↻ Status</button>
        <button id="go-home" class="nav-btn">Home</button>
        <button id="browse-videos" class="nav-btn">Browse Videos</button>
        <button id="random-video" class="nav-btn">Random Video</button>
        <button id="shuffle" class="nav-btn">Shuffle</button>
        <button id="tag-select" class="nav-btn">Tag Select</button>
        <button id="pip-btn" class="nav-btn" style="display: none;">◳ PiP Mode</button>
        <label class="mobile-checkbox">
            <input type="checkbox" id="mobile-mode"> Mobile Mode (H.264 Only)
        </label>
        </div>
        <div id="filter-options" style="display: none;">
            <div class="filter-section">
                <div class="filter-header">
                    Tags <span class="arrow">▼</span>
                </div>
                <div class="filter-content" id="filter-content">
                    <div id="tags-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Language <span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="languages-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Decade <span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="decades-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Difficulty <span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="difficulties-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Genre <span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="genres-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Production Company <span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="production-companies-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Network <span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="networks-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Country <span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="countries-list"></div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-header">
                    Special Openings<span class="arrow">▼</span>
                </div>
                <div class="filter-content">
                    <div id="special"></div>
                    <div class="tristate-item">
                        <label class="tristate-container">
                            <input type="checkbox" class="tristate-checkbox" id="special-checkbox" value="special-openings" data-tristate="null">
                            <span class="tristate-label">Special Openings</span>
                            <span class="tristate-state" id="special-checkbox-state">(null)</span>
                        </label>
                    </div>
                </div>
            </div>
            <button id="apply-filters" class="nav-btn">Apply Filters</button>
        </div>
        <div id="video-browser" style="display: none;">
            <h2>Video Library</h2>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search videos..." autocomplete="off">
                <button id="search-btn" class="nav-btn">Search</button>
            </div>
            <div id="video-stats" class="stats"></div>
            <div id="loading-indicator" class="loading" style="display: none;">Loading videos...</div>
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="video-grid" class="video-grid"></div>
        </div>
        <div id="loading-screen" style="display: none;">
        </div>
        <div id="player-screen" style="display: none;">
            <button id="back-to-browser" class="nav-btn">Back to Library</button>
            <div class="video-container">
                <video id="video-player" controls playsinline></video>
                <video id="video-preload" preload="auto" style="display:none;"></video>
            </div>
            <div class="video-meta">
                <div id="current-video-title" class="video-title"></div>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fil"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </div>
      </div>
    </div>
    <script defer src="controller.js"></script>
    <script defer src="tsPlayer.js"></script>
  </body>
</html>
