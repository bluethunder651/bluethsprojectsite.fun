<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forgot Password - Blueth's Project Site</title>
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <div class="auth-container">
            <h1 class="auth-title">Forgot Password</h1>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required>
                </div>
                <button type="submit" class="auth-btn" id="submitBtn">Reset Password</button>
            </form>
            <div class="auth-links">
                <a href="register.html">Create Account</a>
                <a href="index.html">Home</a>
            </div>
        </div>
    </body>
    <script>
        const email = document.getElementById('email');
        const serverUrl = 'https://julia.bluethsprojectsite.fun';

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            submitBtn.disabled = true;
            
            const formData = {
                email: document.getElementById('email').value
            }

            try{
                const response = await fetch(`${serverUrl}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok){
                    successEl.textContent = data.message;
                    successEl.style.display = 'block';

                    e.target.reset();

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    errorEl.textContent = data.error || 'Email send failed';
                    errorEl.style.display = 'block';
                    submitBtn.disabled = false;
                }
            } catch (error){
                error.textContent = error;
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
            }
        });
    </script>
</html>
