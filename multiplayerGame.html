<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Theme Song Game</title>
        <link rel="stylesheet" href="multiplayerGame.css">
    </head>
    <body>
        <div id="app">
            <div id="loading-screen" class="screen">
                <h3>Loading...</h3>
            </div>
            <div id="game-screen" class="screen">
            <h3 id="scores" class="score"></h3>
            <div id="video-screen">
                <div id="answer-title" class="video-title"></div> 
                <div class="video-container">
                    <video id="video-player" playsinline></video>
                    <video id="video-preload" preload="auto" style="display: none;"></video>
                    <video id="video-buffer1" preload="auto" style="display: none;"></video>
                    <video id="video-buffer2" preload="auto" style="display: none;"></video>
                </div>
            </div>
            <div id="answer-buttons" class="answer-buttons">
                <button data-option="1" class="answer-btn"></button>
                <button data-option="2" class="answer-btn"></button>
                <button data-option="3" class="answer-btn"></button>
                <button data-option="4" class="answer-btn"></button>
            </div>
            <div id="nav-bar">
                <button id="go-back-btn" class="nav-btn">Main Menu</button>
                <button id="next-video" class="nav-btn" disabled>Next</button>
            </div>
        </div>
        </div> 
        <script defer src="multiplayerGame.js"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
        <script defer src="controller.js"></script>
    </body>
</html>
