<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Theme Song Game</title>
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <div class="auth-container">
            <h1 class="auth-title">Create Account</h1>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required minlength="3">
                    <div class="password-requirements">At least 3 characters</div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8">
                    <div class="password-requirements">At least 8 characters</div>
                    <div class="password-strength">
                        <div id="passwordStrength" class="password-strength-bar"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" required>
                    <div id="passwordMatch" class="password-requirements"></div>
                </div>
                <button type="submit" class="auth-btn" id="submitBtn">Create Account</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Already have an account?</a>
                <a href="index.html">Home</a>
            </div>
        </div>
    </body>
    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const strengthBar = document.getElementById('passwordStrength');
        const matchDiv = document.getElementById('passwordMatch');
        const serverUrl = 'https://julia.bluethsprojectsite.fun';
        
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = 'weak';
            
            if (password.length >= 8) {
                const hasUpper = /[A-Z]/.test(password);
                const hasLower = /[a-z]/.test(password);
                const hasNumber = /[0-9]/.test(password);
                const hasSpecial = /[^A-Za-z0-9]/.test(password);
                
                const score = [hasUpper, hasLower, hasNumber, hasSpecial].filter(Boolean).length;
                
                if (score >= 3 && password.length >= 10) strength = 'strong';
                else if (score >= 2) strength = 'medium';
            }
            
            strengthBar.className = 'password-strength-bar';
            if (strength === 'weak') strengthBar.classList.add('strength-weak');
            else if (strength === 'medium') strengthBar.classList.add('strength-medium');
            else if (strength === 'strong') strengthBar.classList.add('strength-strong');
            
            checkPasswordMatch();
        });
        
        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (confirm) {
                if (password === confirm) {
                    matchDiv.textContent = '✓ Passwords match';
                    matchDiv.style.color = '#48bb78';
                } else {
                    matchDiv.textContent = '✗ Passwords do not match';
                    matchDiv.style.color = '#f56565';
                }
            } else {
                matchDiv.textContent = '';
            }
        }
        
        confirmInput.addEventListener('input', checkPasswordMatch);
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }
            
            if (password.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters';
                errorEl.style.display = 'block';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                confirm_password: confirm
            };
            
            try {
                const response = await fetch(`${serverUrl}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successEl.textContent = data.message;
                    successEl.style.display = 'block';
                    
                    e.target.reset();
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    errorEl.textContent = data.error || 'Registration failed';
                    errorEl.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            } catch (error) {
                errorEl.textContent = error;
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</html>
