<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Theme Song Game</title>
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <div class="auth-container">
            <h1 class="auth-title">Create Account</h1>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required minlength="3">
                    <div class="password-requirements">At least 3 characters</div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8">
                    <div class="password-requirements">At least 8 characters</div>
                    <div class="password-strength">
                        <div id="passwordStrength" class="password-strength-bar"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" required>
                    <div id="passwordMatch" class="password-requirements"></div>
                </div>
                <button type="submit" class="auth-btn" id="submitBtn">Create Account</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Already have an account?</a>
                <a href="index.html">Home</a>
            </div>
        </div>
    </body>
    <script defer src="signandlogin.js"></script>
</html>
